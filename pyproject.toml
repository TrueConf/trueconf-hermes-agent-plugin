[project]
name = "hermes-agent-trueconf-plugin"
version = "1.0.1"
description = "TrueConf messaging platform plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause-Clear"
authors = [
    { name = "Anton Baadzhi" },
]
keywords = ["hermes-agent", "messaging", "plugin", "trueconf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "mistune>=3,<4",
    "packaging>=24",
    "python-trueconf-bot>=1.5.3,<2",
]

[project.urls]
Repository = "https://github.com/TrueConf/trueconf-hermes-agent-plugin"
Issues = "https://github.com/TrueConf/trueconf-hermes-agent-plugin/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.10",
    "ty>=0.0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# Match the python-trueconf-bot formatting budget.
line-length = 120

[tool.ruff.lint]
# Match the python-trueconf-bot rule set; pinned explicitly so ruff's shifting
# implicit defaults (0.16 jumped from ~120 to ~800 rules) cannot move it.
select = ["E", "F", "W", "I", "C90", "B", "BLE", "ERA", "UP007", "UP045", "RUF", "SIM", "C4", "ASYNC", "N", "A", "PT"]
# Test strings intentionally mix look-alike Cyrillic/Latin letters.
allowed-confusables = ["с", "а", "е", "о", "р", "х"]

[tool.ruff.lint.per-file-ignores]
# Ratchet baseline (same pattern as hermes-agent): each entry is an EXISTING
# violation being fixed in its own change; do not add new files here.
"__init__.py" = ["C901", "N999"]
"adapter.py" = ["BLE001", "C901"]
"tests/**" = ["ASYNC240"]
